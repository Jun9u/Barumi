name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-quality:
    name: Python quality and repository hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install development tools
        run: python -m pip install -r requirements-dev.txt
      - name: Commit checks
        run: python -m pre_commit run --all-files
      - name: Tests
        run: python -m pytest

  frontend-build:
    name: Frontend TypeScript build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Detect frontend project
        id: detect
        shell: bash
        run: |
          if [[ -f frontend/package.json ]]; then
            if [[ ! -f frontend/package-lock.json ]]; then
              echo "::error::frontend/package-lock.json is missing; npm ci needs a lockfile."
              exit 1
            fi
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Frontend not merged yet; skipping until package.json exists."
          fi

      - name: Set up Node.js
        if: steps.detect.outputs.present == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: npm ci

      - name: Type-check and build frontend
        if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: npm run build

  backend-build:
    name: Backend Java build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Detect backend project
        id: detect
        shell: bash
        run: |
          if [[ -f backend/build.gradle || -f backend/build.gradle.kts ]]; then
            if [[ ! -f backend/gradlew || ! -f backend/gradle/wrapper/gradle-wrapper.jar ]]; then
              echo "::error::Backend Gradle Wrapper is incomplete."
              exit 1
            fi
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Backend not merged yet; skipping until build.gradle exists."
          fi

      - name: Set up Java
        if: steps.detect.outputs.present == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Build and run backend tests
        if: steps.detect.outputs.present == 'true'
        working-directory: backend
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon build
