# Only add existing area labels; do not synchronize the repository label catalog.
'area:frontend':
  - changed-files:
      - any-glob-to-any-file: 'frontend/**'
'area:backend':
  - changed-files:
      - any-glob-to-any-file: 'backend/**'
'area:ai':
  - changed-files:
      - any-glob-to-any-file: 'ai/**'
'area:data':
  - changed-files:
      - any-glob-to-any-file: 'data/**'
'area:infra':
  - changed-files:
      - any-glob-to-any-file:
          - '.github/**'
          - 'scripts/**'
          - 'tests/**'
          - '.pre-commit-config.yaml'
          - '.coderabbit.yaml'
          - '.editorconfig'
          - '.gitattributes'
          - '.gitignore'
          - 'pyproject.toml'
          - 'requirements-dev.txt'
'area:docs':
  - changed-files:
      - any-glob-to-any-file: ['docs/**', '**/*.md']
